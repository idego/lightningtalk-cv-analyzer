services:
  api:
    # Compatibility overlay. The standard stack now requires GeoNames too;
    # this file only lets operators override the default snapshot directory.
    volumes:
      - type: bind
        source: ${CV_VALIDATOR_REFERENCE_DATA_DIR:?set CV_VALIDATOR_REFERENCE_DATA_DIR to an approved versioned directory}
        target: /app/reference-data
        read_only: true
        bind:
          create_host_path: false
