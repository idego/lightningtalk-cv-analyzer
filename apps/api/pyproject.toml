[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cv-validator"
version = "0.1.0"
description = "CV location consistency analyzer — decision support, not verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpcore>=1.0.9,<2.0.0",
  "httpx>=0.27.0",
  "jsonschema>=4.23.0",
  "openai>=2.0.0,<3.0.0",
  "phonenumbers==9.0.37",
  "uvicorn>=0.32.0",
  "python-multipart>=0.0.9",
]

[project.scripts]
cv-location-index = "cv_validator.location.index_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "reportlab>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cv_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
