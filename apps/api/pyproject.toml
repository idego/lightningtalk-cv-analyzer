[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cv-validator"
version = "0.1.0"
description = "CV location consistency analyzer — decision support, not verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "phonenumbers>=8.13.0",
  "pdfplumber>=0.11.0",
  "python-docx>=1.1.0",
  "pyyaml>=6.0.0",
  "uvicorn>=0.32.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "jsonschema>=4.23.0",
  "pytest>=8.0.0",
  "reportlab>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cv_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
