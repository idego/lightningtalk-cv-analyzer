services:
  web:
    build:
      context: ./apps/web
    ports:
      # Host port -> container port 3000 (Next.js always listens on 3000 inside)
      - "${WEB_HOST:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me}
      BETTER_AUTH_DB_PATH: /app/data/auth.db
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-idego.io}
      LOCAL_DEV_AUTH_BYPASS: ${LOCAL_DEV_AUTH_BYPASS:-false}
      INTERNAL_API_URL: http://api:8000
      CV_VALIDATOR_FEEDBACK_ENABLED: ${CV_VALIDATOR_FEEDBACK_ENABLED:-false}
      CV_VALIDATOR_FEEDBACK_INBOX_ENABLED: ${CV_VALIDATOR_FEEDBACK_INBOX_ENABLED:-false}
      CV_VALIDATOR_FEEDBACK_FAILURES_ENABLED: ${CV_VALIDATOR_FEEDBACK_FAILURES_ENABLED:-false}
      CV_VALIDATOR_FEEDBACK_INTERNAL_TOKEN: ${CV_VALIDATOR_FEEDBACK_INTERNAL_TOKEN:-}
    volumes:
      - web_auth_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./apps/api
      target: runtime
    expose:
      - "8000"
    environment:
      CV_VALIDATOR_DB_PATH: /app/data/cv_validator.db
      CV_VALIDATOR_RETENTION_DAYS: ${CV_VALIDATOR_RETENTION_DAYS:-90}
      CV_VALIDATOR_FEEDBACK_ENABLED: ${CV_VALIDATOR_FEEDBACK_ENABLED:-false}
      CV_VALIDATOR_FEEDBACK_INBOX_ENABLED: ${CV_VALIDATOR_FEEDBACK_INBOX_ENABLED:-false}
      CV_VALIDATOR_FEEDBACK_FAILURES_ENABLED: ${CV_VALIDATOR_FEEDBACK_FAILURES_ENABLED:-false}
      CV_VALIDATOR_FEEDBACK_HMAC_SECRET: ${CV_VALIDATOR_FEEDBACK_HMAC_SECRET:-}
      CV_VALIDATOR_FEEDBACK_INTERNAL_TOKEN: ${CV_VALIDATOR_FEEDBACK_INTERNAL_TOKEN:-}
      CV_VALIDATOR_MINIMUM_MEANINGFUL_TOKENS: ${CV_VALIDATOR_MINIMUM_MEANINGFUL_TOKENS:-5}
      CV_VALIDATOR_SMALL_LOCALITY_MAX_POPULATION: ${CV_VALIDATOR_SMALL_LOCALITY_MAX_POPULATION:-10000}
      CV_VALIDATOR_WEIGHTS_PATH: /app/weights.yaml
      CV_VALIDATOR_AI_ENABLED: ${CV_VALIDATOR_AI_ENABLED:-false}
      CV_VALIDATOR_AI_TRANSPORT_RETRY_LIMIT: ${CV_VALIDATOR_AI_TRANSPORT_RETRY_LIMIT:-1}
      CV_VALIDATOR_AI_INVALID_RESPONSE_RETRY_LIMIT: ${CV_VALIDATOR_AI_INVALID_RESPONSE_RETRY_LIMIT:-1}
      CV_VALIDATOR_AI_ABSOLUTE_ATTEMPT_LIMIT: ${CV_VALIDATOR_AI_ABSOLUTE_ATTEMPT_LIMIT:-3}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CV_VALIDATOR_BATCH_MAX_FILES: ${CV_VALIDATOR_BATCH_MAX_FILES:-4}
      CV_VALIDATOR_BATCH_MAX_BYTES: ${CV_VALIDATOR_BATCH_MAX_BYTES:-20971520}
      CV_VALIDATOR_RESEARCH_CACHE_TTL_DAYS: ${CV_VALIDATOR_RESEARCH_CACHE_TTL_DAYS:-30}
      CV_VALIDATOR_LINKEDIN_CONNECTION_THRESHOLD: ${CV_VALIDATOR_LINKEDIN_CONNECTION_THRESHOLD:-500}
      CV_VALIDATOR_LINKEDIN_MAX_PROFILES: ${CV_VALIDATOR_LINKEDIN_MAX_PROFILES:-3}
      CV_VALIDATOR_LINK_CHECK_ENABLED: ${CV_VALIDATOR_LINK_CHECK_ENABLED:-true}
      CV_VALIDATOR_LINK_CHECK_PROTOCOLS: ${CV_VALIDATOR_LINK_CHECK_PROTOCOLS:-https,http}
      CV_VALIDATOR_LINK_CHECK_PORTS: ${CV_VALIDATOR_LINK_CHECK_PORTS:-80,443}
      CV_VALIDATOR_LINK_CHECK_TIMEOUT_SECONDS: ${CV_VALIDATOR_LINK_CHECK_TIMEOUT_SECONDS:-5}
      CV_VALIDATOR_LINK_CHECK_MAX_RESPONSE_BYTES: ${CV_VALIDATOR_LINK_CHECK_MAX_RESPONSE_BYTES:-65536}
      CV_VALIDATOR_LINK_CHECK_MAX_REDIRECTS: ${CV_VALIDATOR_LINK_CHECK_MAX_REDIRECTS:-3}
      CV_VALIDATOR_LINK_CHECK_MAX_CONCURRENCY: ${CV_VALIDATOR_LINK_CHECK_MAX_CONCURRENCY:-4}
      CV_VALIDATOR_LINK_CHECK_MAX_RETRIES: ${CV_VALIDATOR_LINK_CHECK_MAX_RETRIES:-0}
      CV_VALIDATOR_LINK_CHECK_TOTAL_BUDGET_SECONDS: ${CV_VALIDATOR_LINK_CHECK_TOTAL_BUDGET_SECONDS:-20}
      CV_VALIDATOR_LINK_CHECK_USER_AGENT: ${CV_VALIDATOR_LINK_CHECK_USER_AGENT:-CV-Validator-Link-Checker/1}
      CV_VALIDATOR_LOCATION_INDEX_PATH: /app/reference-data/locations.sqlite3
      CV_VALIDATOR_LOCATION_MANIFEST_PATH: /app/reference-data/locations.manifest.json
      CV_VALIDATOR_REQUIRE_LOCATION_RESOLVER: "true"
    volumes:
      - cv_validator_data:/app/data
      - type: bind
        source: ${CV_VALIDATOR_REFERENCE_DATA_DIR:-./data/geonames-build/2026-08-21}
        target: /app/reference-data
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  test:
    build:
      context: ./apps/api
      target: dev
    environment:
      CV_VALIDATOR_MINIMUM_MEANINGFUL_TOKENS: ${CV_VALIDATOR_MINIMUM_MEANINGFUL_TOKENS:-5}
      CV_VALIDATOR_WEIGHTS_PATH: /app/weights.yaml
      CV_VALIDATOR_REPO_ROOT: /workspace
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro
      - ./docker-compose.reference-data.yml:/workspace/docker-compose.reference-data.yml:ro
      - ./.gitignore:/workspace/.gitignore:ro
      - ./apps/api/Dockerfile:/workspace/apps/api/Dockerfile:ro
      - ./apps/api/.dockerignore:/workspace/apps/api/.dockerignore:ro
    command: ["pytest", "-q"]
    profiles:
      - test

volumes:
  cv_validator_data:
  web_auth_data:
